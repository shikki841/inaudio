name: Feature request
description: Propose a focused improvement to Inaudio
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Keep one proposal per issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should change?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful behavior and how it should feel.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request is specific to Inaudio.
          required: true
        - label: I searched existing issues and discussions.
          required: true
