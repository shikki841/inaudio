name: PR policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: read
    steps:
      - name: Validate title and linked issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });
            const title = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\([^\r\n()]+\))?!?: [^\s].*$/.exec(pr.title);
            if (!title) {
              core.setFailed('Use a Conventional Commit title, for example: fix(audio): recover disconnected devices.');
              return;
            }
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '').replace(/```[\s\S]*?```|~~~[\s\S]*?~~~/g, '').replace(/`[^`\n]*`/g, '').replace(/^\s*>.*$/gm, '');
            const exemption = /^No-issue:[ \t]*(\S[^\r\n]{9,})[ \t]*\r?$/im.exec(body);
            if (exemption && exemption[1].trim().length >= 10 && ['docs', 'build', 'ci', 'chore'].includes(title[1])) {
              core.notice('Maintenance exemption: ' + exemption[1]);
              return;
            }
            const repository = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const references = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+(?:(https:\/\/github\.com\/([\w.-]+\/[\w.-]+)\/issues\/([1-9]\d*))|(?:([\w.-]+\/[\w.-]+)?#([1-9]\d*)))(?=$|[\s.,;!?)])/gi;
            const numbers = new Set();
            for (const match of body.matchAll(references)) {
              const target = match[2] || match[4] || repository;
              if (target.toLowerCase() === repository) numbers.add(Number(match[3] || match[5]));
            }
            for (const issue_number of [...numbers].slice(0, 10)) {
              try {
                const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
                if (!issue.pull_request) return;
              } catch (error) {
                if (error.status !== 404 && error.status !== 422) throw error;
              }
            }
            core.setFailed('Link an existing issue in this repository with Closes #123, Fixes #123, or Resolves #123 in the PR description. Maintenance PRs with docs/build/ci/chore titles may instead use a No-issue: line with a meaningful reason (at least 10 characters).');
