name: Update rollout percentage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v1.2.3
        required: true
        type: string
      percentage:
        description: Percentage of installations eligible to receive the release
        required: true
        type: number
        default: 10

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          STAGING_PERCENTAGE: ${{ inputs.percentage }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/set-rollout.mjs
