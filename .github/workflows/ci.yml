name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Version applied only to the disposable build checkout
        type: string
        default: ''
      release-build:
        description: Upload installers for the separate release publisher
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  checks:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test scripts/*.test.mjs

  build:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm flatpak flatpak-builder fuse3 dbus-x11 xvfb
      - name: Add Flatpak runtime remote
        if: runner.os == 'Linux'
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: npm ci
      - name: Apply release version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
      - name: Generate macOS application icon
        if: runner.os == 'macOS'
        run: |
          mkdir -p assets/icons/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/icons/icon.png --out "assets/icons/icon.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/icons/icon.png --out "assets/icons/icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns assets/icons/icon.iconset -o assets/icons/icon.icns
          rm -r assets/icons/icon.iconset
      - name: Build release artifacts
        if: runner.os != 'Linux'
        run: npm run package:release
      - name: Build Linux release artifacts
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash -c 'export DBUS_SYSTEM_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS"; npm run package:release'
      - name: Install Flatpak bundle for smoke test
        if: matrix.platform == 'linux-x64'
        run: |
          bundle=$(find out/builder -maxdepth 1 -type f -name '*.flatpak' -print -quit)
          test -n "$bundle"
          flatpak install --user --assumeyes --noninteractive --bundle "$bundle"
      - name: Inspect Flatpak metadata and launch
        if: matrix.platform == 'linux-x64'
        run: |
          metadata=$(flatpak info --user --show-metadata app.inaudio.desktop)
          grep -F 'runtime=org.freedesktop.Platform/x86_64/26.08' <<< "$metadata"
          grep -F 'wayland' <<< "$metadata"
          grep -F 'x11' <<< "$metadata"
          grep -F 'pulseaudio' <<< "$metadata"
          grep -F 'network' <<< "$metadata"
          if ! awk -F= '$1 == "filesystems" { count = split($2, grants, /[;,]/); for (i = 1; i <= count; i++) if (grants[i] == "home") exit 1 }' <<< "$metadata"; then
            echo "Flatpak metadata grants broad home-directory access."
            exit 1
          fi
          set +e
          timeout --signal=TERM 25s dbus-run-session -- xvfb-run -a flatpak run --user app.inaudio.desktop --disable-gpu
          result=$?
          set -e
          if [[ "$result" -ne 124 ]]; then
            echo "Flatpak did not remain running during the smoke test (exit $result)."
            exit 1
          fi
      - name: Collect installers and checksums
        run: node scripts/release-assets.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.release-build && 'release' || 'pr' }}-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
